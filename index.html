<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090710"><title>Órbita · Apresentação interativa</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#090710;color:white}.layout{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px}.top{width:min(100%,1400px);display:flex;align-items:center;justify-content:space-between;gap:12px}.top strong{font-size:15px}.top small{color:#bbb}.stage{width:min(100%,1400px);aspect-ratio:16/9;max-height:calc(100dvh - 155px);position:relative;border-radius:12px;overflow:hidden;background:#170b19;box-shadow:0 24px 100px #000b}.stage>img{height:100%;width:100%;object-fit:contain;display:block}.nav{display:flex;align-items:center;gap:8px}.btn,a.btn{background:#28202e;border:1px solid #5e334b;color:#fff;border-radius:10px;padding:10px 13px;cursor:pointer;text-decoration:none;font:inherit;font-size:14px}.btn:hover{border-color:#ff397f}.btn:focus-visible{outline:2px solid #fd2d76}.btn.primary{background:#c90053;border-color:#c90053}.below{width:min(100%,1400px);display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}.below input{accent-color:#ed1263;flex:1;min-width:120px}.video{position:absolute;right:16px;bottom:16px;background:#d9005b;border:0;color:white;font-weight:700;font-size:15px;padding:13px 20px;border-radius:12px;text-decoration:none;box-shadow:0 4px 30px #000b}.hidden{display:none!important}.label{font-size:13px;color:#d9c6d1}.modal{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}.modalBox{background:#180e1d;border:1px solid #bd2460;border-radius:15px;width:min(1100px,100%);padding:15px}.modalTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.frame{width:100%;aspect-ratio:16/9;border:0;background:black}.hint{color:#b9a6b4;font-size:12px;line-height:1.5}.tip{color:#b7adb5;font-size:12px}@media(max-width:600px){.layout{justify-content:flex-start;padding:8px}.top strong{font-size:13px}.top small{display:none}.stage{border-radius:4px}.btn{padding:8px;font-size:12px}.below{gap:6px}.video{right:6px;bottom:6px;padding:8px;font-size:12px}}
.library{width:min(100%,1400px);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:8px;max-height:140px;overflow:auto}.library button{font-size:12px}.stage:fullscreen{width:100vw;height:100vh;max-height:none;aspect-ratio:auto;border-radius:0}.stage:fullscreen>img{object-fit:contain}</style></head><body><main class="layout"><header class="top"><div><strong>ÓRBITA</strong><small> · Compliance na Era Digital</small></div><span class="label">Apresentação interativa — slides e vídeos</span></header><section class="stage" id="stage"><img alt="Slide da apresentação Órbita" id="slide" src="slides/01.webp"><button class="video hidden" id="play">▶ Assistir ao vídeo deste slide</button></section><section class="below"><nav class="nav"><button class="btn" id="prev" aria-label="Voltar slide">← Anterior</button><span class="label" id="number">1 / 64</span><button class="btn primary" id="next" aria-label="Próximo slide">Próximo →</button></nav><input type="range" min="1" max="64" value="1" id="slider" aria-label="Selecionar slide"><button class="btn" id="catalog">▶ Biblioteca de vídeos</button><button class="btn" id="full">⛶ Tela cheia</button></section><p class="tip">Use ← → para navegar e F para tela cheia. Os vídeos são servidos neste site, sem login no Google Drive.</p><div id="library" class="library hidden"></div></main><div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-label="Reprodução de vídeo"><div class="modalBox"><div class="modalTop"><strong>Vídeo do slide <span id="videoNumber"></span></strong><button class="btn" id="close">✕ Fechar</button></div><iframe id="frame" class="frame" src="about:blank" allow="autoplay; fullscreen" allowfullscreen referrerpolicy="no-referrer"></iframe><p class="hint"><a id="external" target="_blank" rel="noopener noreferrer" style="color:#ff6fa2">Abrir mídia diretamente</a>.</p></div></div><script>
const media={"36": "abertura.mp4", "37": "ia-no-trabalho.mp4", "43": "motion-completo.mp4", "45": "analise-operacional.mp4", "47": "escala-por-foto.mp4", "49": "holerite.mp4", "50": "comunicacoes.gif", "53": "criar-vaga.mp4"};
const catalog=[
['abertura.mp4','Abertura — IA no RH'],['ia-no-trabalho.mp4','IA no trabalho — 15s'],['motion-completo.mp4','Motion completo — 70s'],
['analise-operacional.mp4','Quadro, ausências e extras'],['escala-por-foto.mp4','Escala por foto'],
['holerite.mp4','Explicação de holerite'],['comunicacoes.gif','Comunicações e resumo de IA'],
['politicas.mp4','Políticas e publicação'],['criar-vaga.mp4','Criação de vaga'],['solicitacao-compra.mp4','Solicitação de compra']];
let i=1;const $=x=>document.getElementById(x);const max=64;
function show(n){i=Math.min(max,Math.max(1,n));$('slide').src='slides/'+String(i).padStart(2,'0')+'.webp';$('slide').alt='Slide '+i+' de '+max;$('number').textContent=i+' / '+max;$('slider').value=i;$('play').classList.toggle('hidden',!media[i]);history.replaceState(null,'','#slide-'+i)}
$('next').onclick=()=>show(i+1);$('prev').onclick=()=>show(i-1);$('slider').oninput=e=>show(+e.target.value);
$('full').onclick=()=>{if(!document.fullscreenElement)$('stage').requestFullscreen?.();else document.exitFullscreen?.()};
function close(){ $('modal').classList.add('hidden');$('frame').src='about:blank';const player=$('mediaPlayer');if(player)player.remove()}
function openMedia(file,label){$('videoNumber').textContent=label||i;const url='videos/'+encodeURIComponent(file);const isGif=file.endsWith('.gif');$('external').href=url;$('external').textContent='Abrir mídia diretamente';$('frame').style.display='none';const old=$('mediaPlayer');if(old)old.remove();const el=document.createElement(isGif?'img':'video');el.id='mediaPlayer';el.className='frame';el.style.display='block';if(!isGif){el.controls=true;el.autoplay=true;el.playsInline=true;}el.src=url;$('frame').parentNode.insertBefore(el,$('frame'));$('modal').classList.remove('hidden')}
$('play').onclick=()=>{const f=media[i];if(f)openMedia(f,'do slide '+i)};
$('catalog').onclick=()=>{const d=$('library');d.classList.toggle('hidden');d.innerHTML=catalog.map(([file,label])=>'<button class="btn" data-video="'+file+'">▶ '+label+'</button>').join('');d.querySelectorAll('button').forEach(b=>b.onclick=()=>openMedia(b.dataset.video,b.textContent.slice(2)))};
$('close').onclick=close;$('modal').onclick=e=>{if(e.target===$('modal'))close()};
document.onkeydown=e=>{if(!$('modal').classList.contains('hidden')){if(e.key==='Escape')close();return}if(e.key==='ArrowRight'||e.key===' ')show(i+1);if(e.key==='ArrowLeft')show(i-1);if(e.key.toLowerCase()==='f')$('full').click();};
show(Number(location.hash.match(/slide-(\d+)/)?.[1]||1));
</script></body></html>
